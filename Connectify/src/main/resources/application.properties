spring.application.name= connectify

logging.level.org.springframework.web.socket=DEBUG


# Public Railway endpoint (for local runs)
spring.datasource.url= jdbc:mysql://localhost:3306/connectify
spring.datasource.username=root
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kumarshubham2005a@gmail.com
spring.mail.password= ${EMAILPASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# logging configuration
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=WARN
logging.level.com.connectify.demo=TRACE

## CORS Config ##
cors.allowedOrigins=http://localhost:3000
cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowedHeaders=Authorization,Content-Type,token
